[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "choya-wii-converter"
version = "0.23.3"
description = "Optimiza los recursos de juegos de Wii para la Anbernic RG35XX H con KNULLI"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=9.1"]
optional-dependencies = { audio = ["scipy>=1.8"] }

[project.scripts]
choya = "choya.cli:main"

[tool.setuptools]
packages = ["choya"]

[tool.setuptools.package-data]
choya = ["data/*", "data/aurora/*", "data/aurora/sin_dawn/*", "data/aurora/sin_dawn/include/*/*", "data/aurora/sin_dawn/include/*/*/*"]
